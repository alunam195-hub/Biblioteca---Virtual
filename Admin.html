<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Biblioteca Virtual</title>

    <link rel="stylesheet" href="Admin.css">
</head>

<body>

<header>

    <div class="logo">
        <i class="fas fa-book-open"></i>
        <h2>Biblioteca Virtual</h2>
    </div>

    <nav>
        <a href="index.html">Início</a>
        <a href="Livros.html">Livros</a>
        <a href="Login.html">Sair</a>
    </nav>

</header>

<main class="admin">

    <h1>Painel Administrativo</h1>

    <section class="cards-admin">

        <div class="card-admin">
            <i class="fas fa-book fa-3x"></i>
            <h2>Livros</h2>
            <p>Gerencie os livros cadastrados.</p>
            <button class="btn">Gerenciar</button>
        </div>

        <div class="card-admin">
            <i class="fas fa-video fa-3x"></i>
            <h2>Vídeos</h2>
            <p>Cadastre e edite vídeos.</p>
            <button class="btn">Gerenciar</button>
        </div>

        <div class="card-admin">
            <i class="fas fa-users fa-3x"></i>
            <h2>Usuários</h2>
            <p>Visualize e gerencie usuários.</p>
            <button class="btn">Gerenciar</button>
        </div>

        <div class="card-admin">
            <i class="fas fa-chart-bar fa-3x"></i>
            <h2>Relatórios</h2>
            <p>Acompanhe os acessos ao sistema.</p>
            <button class="btn">Visualizar</button>
        </div>

    </section>

</main>

<footer>
    <p>© 2026 Biblioteca Virtual - Todos os direitos reservados.</p>
</footer>
<script src="Admin.js"></script>
</body>
</html>
