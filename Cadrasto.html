<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Biblioteca Virtual</title>

    <link rel="stylesheet" href="Cadrasto.css">
   
</head>

<body class="pagina-login">

<div class="login-container">

    <div class="login-box">

        <div class="logo-login">
            <i class="fas fa-book-open"></i>
            <h2>Biblioteca Virtual</h2>
        </div>

        <h3>Crie sua conta</h3>

        <form>

            <label>Nome Completo</label>
            <input type="text" placeholder="Digite seu nome" required>

            <label>E-mail</label>
            <input type="email" placeholder="Digite seu e-mail" required>

            <label>Senha</label>
            <input type="password" placeholder="Mínimo de 8 caracteres" required>

            <label>Confirmar Senha</label>
            <input type="password" placeholder="Repita sua senha" required>

            <button type="submit" class="btn">
                Criar Conta
            </button>

        </form>

        <p>
            Já possui uma conta?
            <a href="Login.html">Fazer Login</a>
        </p>

        <a href="index.html" class="voltar">
            ← Voltar para a página inicial
        </a>

    </div>

</div>
<script src="Cadrasto.js"></script>
</body>
</html>
